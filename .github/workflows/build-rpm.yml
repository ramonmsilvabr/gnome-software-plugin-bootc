name: Build and Publish RPM Repo

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        fedora: [43, 44, 45]   # adicione 45, etc. quando quiser
    container:
      image: quay.io/fedora/fedora:${{ matrix.fedora }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: ramonmsilvabr/gnome-software-plugin-bootc
          ref: main

      - name: Install Build Tools
        run: |
          dnf install -y \
            git rpm-build meson ninja-build gcc pkgconfig \
            gnome-software-devel glib2-devel gobject-introspection-devel

      - name: Build RPM Package
        run: |
          set -euo pipefail
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp spec/rpm/*.spec ~/rpmbuild/SPECS/
          SPEC_FILE=$(find ~/rpmbuild/SPECS -name '*.spec' -print -quit)
          NAME=$(rpmspec -q --qf '%{name}\n' "$SPEC_FILE" | head -n1)
          VERSION=$(rpmspec -q --qf '%{version}\n' "$SPEC_FILE" | head -n1)
          TARBALL_NAME="${NAME}-${VERSION}.tar.gz"
          echo "Package: ${NAME}"
          echo "Version: ${VERSION}"
          echo "Source: ${TARBALL_NAME}"
          git clone --depth=1 \
            https://github.com/ramonmsilvabr/gnome-software-plugin-bootc.git \
            /tmp/source-code
          mkdir -p "/tmp/${NAME}-${VERSION}"
          cp -a /tmp/source-code/. "/tmp/${NAME}-${VERSION}/"
          rm -rf "/tmp/${NAME}-${VERSION}/.git"
          tar -C /tmp \
            -czf "${HOME}/rpmbuild/SOURCES/${TARBALL_NAME}" \
            "${NAME}-${VERSION}"
          rpmbuild -ba "$SPEC_FILE"

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.fedora }}
          path: ~/rpmbuild/RPMS/*/*.rpm

  publish-repo:
    needs: build-rpm
    runs-on: ubuntu-latest
    concurrency:
      group: publish-rpm-repo
      cancel-in-progress: false
    container:
      image: quay.io/fedora/fedora:latest

    steps:
      - name: Install repo tools
        run: dnf install -y git createrepo_c

      - name: Download all RPM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          path: ./rpms

      - name: Update repository on gh-pages
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth=1 "$REMOTE" site
          else
            git init site
            git -C site checkout --orphan gh-pages
            git -C site remote add origin "$REMOTE"
          fi

          # Um diretório por versão do Fedora
          for dir in rpms/rpm-*; do
            ver="${dir##*rpm-}"
            dest="site/fedora/${ver}/x86_64"
            mkdir -p "$dest"
            find "$dir" -name '*.rpm' -exec cp -v {} "$dest/" \;
            createrepo_c --update "$dest"
          done

          cat > site/gnome-software-bootc.repo <<EOF
          [gnome-software-bootc]
          name=GNOME Software bootc plugin
          baseurl=${REPO_URL}/fedora/\$releasever/\$basearch/
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          EOF
          sed -i 's/^          //' site/gnome-software-bootc.repo

          touch site/.nojekyll

          cd site
          git add -A
          git commit -m "Update RPM repo (${GITHUB_REF_NAME:-manual})" || echo "Nada para commitar"
          git push origin gh-pages