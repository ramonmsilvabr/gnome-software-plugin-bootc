name: Build and Release RPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: ramonmsilvabr/gnome-software-plugin-bootc
          ref: main

      - name: Install Build Tools
        run: |
          dnf install -y \
            git rpm-build meson ninja-build gcc pkgconfig \
            gnome-software-devel glib2-devel gobject-introspection-devel

      - name: Build RPM Package
        run: |
          set -euo pipefail
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp build/rpm/*.spec ~/rpmbuild/SPECS/
          SPEC_FILE=$(find ~/rpmbuild/SPECS -name '*.spec' -print -quit)
          NAME=$(rpmspec -q --qf '%{name}\n' "$SPEC_FILE" | head -n1)
          VERSION=$(rpmspec -q --qf '%{version}\n' "$SPEC_FILE" | head -n1)
          TARBALL_NAME="${NAME}-${VERSION}.tar.gz"
          echo "Package: ${NAME}"
          echo "Version: ${VERSION}"
          echo "Source: ${TARBALL_NAME}"
          git clone --depth=1 \
            https://github.com/ramonmsilvabr/gnome-software-plugin-bootc.git \
            /tmp/source-code
          mkdir -p "/tmp/${NAME}-${VERSION}"
          cp -a /tmp/source-code/. "/tmp/${NAME}-${VERSION}/"
          rm -rf "/tmp/${NAME}-${VERSION}/.git"
          tar -C /tmp \
            -czf "${HOME}/rpmbuild/SOURCES/${TARBALL_NAME}" \
            "${NAME}-${VERSION}"
          rpmbuild -ba "$SPEC_FILE"

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-software-bootc-rpm
          path: ~/rpmbuild/RPMS/*/*.rpm

  release:
    needs: build-rpm
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: gnome-software-bootc
          path: ./rpms

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./rpms/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}