name: Build and Release RPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: ramonmsilvabr/gnome-software-plugin-bootc
          ref: main

      - name: Install Build Tools
        run: |
          dnf install -y \
            git rpm-build meson ninja-build gcc pkgconfig \
            gnome-software-devel glib2-devel gobject-introspection-devel

      - name: Build RPM Package
        run: |
         mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

          # 1. Copy spec file to SPECS
          cp build/rpm/*.spec ~/rpmbuild/SPECS/

          # 2. Extract the Name and Version directly from the .spec file
          SPEC_FILE=$(ls ~/rpmbuild/SPECS/*.spec | head -n 1)
          NAME=$(rpmspec -q --qf "%{name}\n" "$SPEC_FILE" | head -n 1)
          VERSION=$(rpmspec -q --qf "%{version}\n" "$SPEC_FILE" | head -n 1)
          TARBALL_NAME="${NAME}-${VERSION}.tar.gz"

          # 3. Create the source archive expected by rpmbuild
          tar --transform "s/^\./${NAME}-${VERSION}/" \
              --exclude='.git' \
              -czf ~/rpmbuild/SOURCES/${TARBALL_NAME} .

          # 4. Run rpmbuild
          rpmbuild -ba "$SPEC_FILE"
      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-software-bootc-rpm
          path: ~/rpmbuild/RPMS/*/*.rpm

  release:
    needs: build-rpm
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: gnome-software-bootc
          path: ./rpms

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./rpms/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}