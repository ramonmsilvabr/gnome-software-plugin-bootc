name: Build and Release RPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: ramonmsilvabr/gnome-software-plugin-bootc
          ref: main

      - name: Install Build Tools
        run: |
          dnf install -y \
            git rpm-build meson ninja-build gcc pkgconfig \
            gnome-software-devel glib2-devel gobject-introspection-devel

      - name: Build RPM Package
        run: |
          # Create RPM build directories
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

          # Copy the spec file from build/rpm/ into the SPECS directory
          cp spec/rpm/*.spec ~/rpmbuild/SPECS/

          # Create a source tarball from the checked-out repository
          TARBALL_NAME="gnome-software-plugin-bootc-0.1.0.tar.gz"
          tar --transform 's/^\./gnome-software-plugin-bootc-main/' \
              --exclude='.git' \
              -czf ~/rpmbuild/SOURCES/${TARBALL_NAME} .

          # Run rpmbuild pointing to the copied spec file
          rpmbuild -ba ~/rpmbuild/SPECS/*.spec

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-software-bootc-rpm
          path: ~/rpmbuild/RPMS/*/*.rpm

  release:
    needs: build-rpm
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: gnome-software-bootc
          path: ./rpms

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./rpms/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}